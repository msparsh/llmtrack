<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="480" fill="none">
  <defs>
    <linearGradient id="box-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="box-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="box-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="12" fill="#0b0f19" stroke="#1f2937" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6">
    llmtrack Architecture &amp; Execution Lifecycle
  </text>
  <text x="50" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#9ca3af">
    One decorator wraps execution, handles jittered retries, parses token usage, calculates cost, and logs to SQLite WAL without breaking.
  </text>

  <!-- Step 1: User Function -->
  <g transform="translate(50, 120)">
    <rect width="200" height="130" rx="8" fill="url(#box-blue)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. Application Code</text>
    <text x="20" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#e2e8f0">@track(provider=...)</text>
    <text x="20" y="80" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#e2e8f0">def call_llm(prompt):</text>
    <text x="20" y="102" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Sync or Async Coroutine</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="185" x2="310" y2="185" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2: Retry Loop with Jitter -->
  <g transform="translate(320, 120)">
    <rect width="200" height="130" rx="8" fill="url(#box-accent)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#60a5fa">2. Retry &amp; Backoff</text>
    <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">• RateLimit (429) &amp; 5xx</text>
    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">• Full Jitter: U(0, base·2ⁿ)</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">• Retry-After header parse</text>
    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#93c5fd">Tracks attempts &amp; retries</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="520" y1="185" x2="580" y2="185" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3: LLM Provider -->
  <g transform="translate(590, 120)">
    <rect width="180" height="130" rx="8" fill="url(#box-blue)" stroke="#a78bfa" stroke-width="1.5" />
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#a78bfa">3. Provider API</text>
    <text x="20" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">OpenAI / Anthropic /</text>
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">Gemini / DeepSeek</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#c4b5fd">Returns response / dict</text>
  </g>

  <!-- Downward Arrow from Provider to Ingestion -->
  <path d="M 680 250 L 680 320 L 530 320" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Step 4: Metadata Ingestion -->
  <g transform="translate(250, 290)">
    <rect width="270" height="140" rx="8" fill="url(#box-green)" stroke="#34d399" stroke-width="1.5" />
    <text x="18" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34d399">4. Metadata Extraction &amp; Cost</text>
    <text x="18" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">Usage Extractor: in/out tokens</text>
    <text x="18" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">Pricing Engine: prefix match $/1M</text>
    <text x="18" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#e2e8f0">Latency: perf_counter() ms</text>
    <text x="18" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#6ee7b7">Safe logging: try/except never breaks call</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="250" y1="360" x2="190" y2="360" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)" />

  <!-- Step 5: SQLite Database -->
  <g transform="translate(50, 290)">
    <rect width="130" height="140" rx="8" fill="url(#box-blue)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">5. SQLite WAL</text>
    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">llm_calls.db</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Indexed ts_utc</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Indexed model</text>
    <text x="16" y="116" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">• Status &amp; tokens</text>
  </g>

  <!-- Step 6: Observability / CLI -->
  <g transform="translate(790, 290)">
    <rect width="160" height="140" rx="8" fill="url(#box-accent)" stroke="#818cf8" stroke-width="1.5" />
    <text x="16" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#818cf8">6. Analytics &amp; CLI</text>
    <text x="16" y="55" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">llmtrack report</text>
    <text x="16" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Cost per day</text>
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• p95 latency</text>
    <text x="16" y="111" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• Error &amp; retry %</text>
    <text x="16" y="129" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">• HTML dashboard</text>
  </g>

  <!-- Curved line from SQLite to CLI -->
  <path d="M 115 430 L 115 455 L 870 455 L 870 430" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
</svg>
