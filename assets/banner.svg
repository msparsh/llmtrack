<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-gradient)" />
  <rect width="1200" height="360" rx="16" stroke="#374151" stroke-width="1.5" />

  <!-- Ambient Glow Circles -->
  <circle cx="200" cy="80" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow-blur)" />
  <circle cx="1000" cy="260" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow-blur)" />

  <!-- Grid lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#1f2937" stroke-width="0.7" opacity="0.6" />
  <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" stroke="#1f2937" stroke-width="0.7" opacity="0.6" />

  <!-- Header Logo & Name -->
  <g transform="translate(80, 75)">
    <!-- Icon -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#glow-cyan)" />
    <path d="M28 14 L20 28 L27 28 L23 42 L36 26 L29 26 Z" fill="#ffffff" />

    <!-- Title -->
    <text x="72" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      llm<tspan fill="url(#glow-cyan)">track</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#9ca3af">
      Lightweight, zero-dependency LLM call tracking, token cost attribution &amp; rate-limit backoff.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(80, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="22" cy="21" r="5" fill="#10b981" />
    <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Zero Core Dependencies</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="200" height="42" rx="21" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="257" cy="21" r="5" fill="#3b82f6" />
    <text x="271" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">SQLite WAL Analytics</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="215" height="42" rx="21" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="472" cy="21" r="5" fill="#f59e0b" />
    <text x="486" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Jittered Backoff (429/5xx)</text>

    <!-- Pill 4 -->
    <rect x="680" y="0" width="165" height="42" rx="21" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="702" cy="21" r="5" fill="#8b5cf6" />
    <text x="716" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Sync &amp; Async def</text>

    <!-- Pill 5 -->
    <rect x="860" y="0" width="160" height="42" rx="21" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />
    <circle cx="882" cy="21" r="5" fill="#ec4899" />
    <text x="896" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Zero-Crash Safety</text>
  </g>

  <!-- Quick snippet box in right bottom -->
  <g transform="translate(80, 275)">
    <text x="0" y="24" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="15" fill="#6ee7b7">
      pip install llmtrack
    </text>
    <text x="210" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#6b7280">
      • Python 3.10+ • OpenAI • Anthropic • DeepSeek • Gemini • Custom
    </text>
  </g>
</svg>
