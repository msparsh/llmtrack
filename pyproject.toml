[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrack"
version = "0.1.0"
description = "Lightweight, zero-dependency LLM call tracking, cost attribution, and automatic rate-limit backoff."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sparsh Mishra", email = "avidunable@gmail.com" }
]
keywords = [
    "llm",
    "tracking",
    "observability",
    "cost-tracking",
    "rate-limit",
    "openai",
    "anthropic",
    "sqlite"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
cli = ["rich>=13.0.0"]
anthropic = ["anthropic>=0.18.0"]
openai = ["openai>=1.0.0"]
all = ["rich>=13.0.0", "anthropic>=0.18.0", "openai>=1.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[project.scripts]
llmtrack = "llmtrack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
